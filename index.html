<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporting System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #3498db;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .report {
            border-left: 5px solid #3498db;
            padding: 10px;
            margin-top: 10px;
            background: #ecf0f1;
        }
    </style>
</head>
<body>

<header>
    <h1>📊 Reporting System</h1>
    <p>Submit and View Reports</p>
</header>

<div class="container">

    <div class="card">
        <h2>📝 Submit Report</h2>
        <input type="text" id="title" placeholder="Report Title">
        <textarea id="description" placeholder="Report Description"></textarea>
        <button onclick="addReport()">Submit</button>
    </div>

    <div class="card">
        <h2>📋 All Reports</h2>
        <div id="reportList"></div>
    </div>

</div>

<script>
    function addReport() {
        let title = document.getElementById("title").value;
        let desc = document.getElementById("description").value;

        if (title === "" || desc === "") {
            alert("Please fill all fields!");
            return;
        }

        let reportList = document.getElementById("reportList");

        let div = document.createElement("div");
        div.className = "report";
        div.innerHTML = "<strong>" + title + "</strong><br>" + desc;

        reportList.appendChild(div);

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
    }
</script>

</body>
</html>
